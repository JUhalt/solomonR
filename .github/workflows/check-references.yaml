name: check-references

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:
  check-references:
    name: References and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Hosted Ubuntu runners can occasionally retain a stale Google
      # Chrome apt source, which makes setup-r fail during apt-get update.
      - name: Remove stale Google Chrome apt source
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list* /etc/apt/sources.list.d/google-chrome.sources*

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Every reference must match the canonical APA 7 list, in APA order,
      # and every work on the Solomon design must have a coverage entry.
      # The script uses base R only.
      - name: Check references against the canonical list
        run: Rscript tools/check-references.R
