name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Hosted Ubuntu runners can occasionally retain a stale Google
      # Chrome apt source, which makes setup-r fail during apt-get update.
      - name: Remove stale Google Chrome apt source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list* /etc/apt/sources.list.d/google-chrome.sources*

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Calculate test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          cat(sprintf("Overall coverage: %.1f%%\n", covr::percent_coverage(cov)))
        shell: Rscript {0}