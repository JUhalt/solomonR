name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          # The minimum R version that DESCRIPTION declares.
          - {os: ubuntu-latest, r: '4.1'}

    steps:
      - uses: actions/checkout@v7

      # Hosted Ubuntu runners can occasionally retain a stale Google
      # Chrome apt source, which makes setup-r fail during apt-get update.
      - name: Remove stale Google Chrome apt source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list* /etc/apt/sources.list.d/google-chrome.sources*

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  R-CMD-check-as-cran:
    name: ubuntu-latest (devel, --as-cran)
    runs-on: ubuntu-latest
    env:
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    steps:
      - uses: actions/checkout@v7

      # Hosted Ubuntu runners can occasionally retain a stale Google
      # Chrome apt source, which makes setup-r fail during apt-get update.
      - name: Remove stale Google Chrome apt source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list* /etc/apt/sources.list.d/google-chrome.sources*

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'
          http-user-agent: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'

  # lavaan and mmrm are in Suggests: the package, its examples, tests, and
  # vignettes must work when they are not installed.
  R-CMD-check-without-optional:
    name: ubuntu-latest (release, without lavaan and mmrm)
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v7

      # Hosted Ubuntu runners can occasionally retain a stale Google
      # Chrome apt source, which makes setup-r fail during apt-get update.
      - name: Remove stale Google Chrome apt source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list* /etc/apt/sources.list.d/google-chrome.sources*

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, lavaan=?ignore, mmrm=?ignore
          needs: check

      - name: Confirm that lavaan and mmrm are not installed
        shell: Rscript {0}
        run: |
          installed <- c("lavaan", "mmrm") %in% rownames(installed.packages())
          if (any(installed)) stop("lavaan or mmrm is installed; this job must run without them.")

      - uses: r-lib/actions/check-r-package@v2
