name: Bug report
description: Report incorrect behavior, an error, or a reproducible software problem.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve solomonR. Please provide a minimal reproducible example when possible.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reprex
    attributes:
      label: Minimal reproducible example
      description: Include code and, when possible, simulated or shareable data that reproduce the problem.
      render: R
  - type: textarea
    id: output
    attributes:
      label: Error, warning, or relevant output
      render: text
  - type: textarea
    id: session
    attributes:
      label: Session information
      description: Paste sessionInfo() or devtools::session_info().
      render: text