name: Feature request
description: Propose a new capability or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Researcher need
      description: What Solomon four-group analysis, diagnostic, teaching, comparison, or reporting need would this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the behavior or workflow you would like solomonR to support.
    validations:
      required: true

  - type: textarea
    id: methods
    attributes:
      label: Methodological basis
      description: If applicable, identify statistical methods, estimands, references, or existing implementations.

  - type: textarea
    id: interpretation
    attributes:
      label: Interpretation and researcher-control considerations
      description: Note assumptions, design decisions, or analytical choices the package should expose rather than automate.
  - type: textarea
    id: acceptance
    attributes:
      label: Completion criteria and roadmap impact
      description: Describe an observable outcome, dependencies, and the relevant roadmap item. State whether this is a proposal or accepted release work.
