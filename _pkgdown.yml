url: https://juhalt.github.io/solomonR

template:
  bootstrap: 5

reference:
  - title: "Decide and plan"
    desc: >
      Sample sizes and power for a Solomon study, before data are collected,
      and simulated studies with known effects for teaching and for checking
      an analysis plan.
    contents:
      - plan_solomon
      - power_solomon
      - plot_power_solomon
      - analysis_plan_solomon
      - simulate_solomon

  - title: "Check the design"
    desc: >
      Design coding, cell structure, clustering, missingness, and baseline
      balance, before analysis.
    contents:
      - validate_solomon
      - check_solomon_missing
      - check_solomon_assumptions
      - baseline_solomon

  - title: "Analyze: recommended methods"
    desc: >
      One model for all the groups, with robust, likelihood-based, and
      randomization-based inference. fit_solomon_glm() also analyzes designs
      with several treatments.
    contents:
      - fit_solomon_glm
      - fit_solomon_ml
      - marginal_solomon
      - perm_solomon
      - equivalence_solomon
      - compare_solomon_methods

  - title: "Analyze: missing posttests"
    desc: >
      Multiple imputation of missing posttests under missing at random, with
      delta-adjusted sensitivity analyses and a tipping-point summary.
    contents:
      - fit_solomon_mi
      - tipping_point_solomon

  - title: "Analyze: longitudinal designs"
    desc: >
      Several posttest occasions, analyzed with a mixed model for repeated
      measures that is valid when participants drop out at random.
    contents:
      - fit_solomon_mmrm

  - title: "Analyze: latent variables"
    desc: >
      Observed- and latent-variable structural equation models, and
      measurement invariance across the Solomon groups.
    contents:
      - fit_solomon_sem
      - fit_solomon_sem_latent
      - invariance_solomon

  - title: "Report"
    desc: >
      APA 7 results text with the references for the methods used.
    contents:
      - report_solomon

  - title: "Synthesize"
    desc: >
      Reanalyze published studies from summary statistics and compute effect
      sizes for meta-analysis.
    contents:
      - solomon_from_summary
      - solomon_effect_sizes

  - title: "History: historical procedures"
    desc: >
      Procedures retained for teaching and for reproducing historical
      analyses, labeled by author and year. They are not the recommended
      analyses.
    contents:
      - fit_solomon_1949
      - fit_solomon_classic
      - plot_classic_flow
      - fit_solomon_steyn
      - fisher_solomon
      - stouffer_solomon
      - p_to_z

  - title: "Plotting"
    contents:
      - plot_solomon_means
      - plot_tipping_point
      - plot_perm
      - plot_solomon_effects
      - plot_sensitization
      - plot_solomon_design
      - plot_solomon_change

  - title: "Data"
    contents:
      - solomon_example
      - solomon_demo
      - elkarkri2025a
      - jordaan2014
      - kvalem1996
      - lana1959
      - mai2020
      - solomon1949
      - steyn2005
      - waltonbraver1988

  - title: "Deprecated"
    desc: >
      Former names that still work, with a warning, through v1.x. Each help
      page names the replacement.
    contents:
      - plot_solomon
      - plot_solomon_gg

  - title: "Package"
    desc: >
      An overview of the package, including the lifecycle stages marked by
      the badge beside each function: stable, experimental, or deprecated;
      and the output contract: the effects table, its columns and contrast
      labels, and tidy(), which the analyses with a table of contrasts share
      and which are stable.
    contents:
      - starts_with("solomonR")
      - solomon_output

