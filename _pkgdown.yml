url: https://juhalt.github.io/solomonR
template:
  bootstrap: 5

reference:
  - title: "Core fitting functions"
    contents:
      - starts_with("fit_solomon_")
  - title: "Inference & utilities"
    contents:
      - perm_solomon
      - stouffer_solomon
      - power_solomon
      - check_solomon_assumptions
      - p_to_z
  - title: "Plotting"
    contents:
      - plot_solomon
      - plot_solomon_gg
      - plot_perm
  - title: "Data"
    contents:
      - solomon_demo
  - title: "Package"
    contents:
      - starts_with("solomonR")
  - title: "SEM"
    contents:
      - fit_solomon_sem
      - fit_solomon_sem_latent
