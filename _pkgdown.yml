url: https://juhalt.github.io/solomonR

template:
  bootstrap: 5

reference:
  - title: "Modern Solomon analysis"
    desc: >
      Unified regression, likelihood, and randomization-based methods.
    contents:
      - fit_solomon_glm
      - fit_solomon_ml
      - perm_solomon
      - equivalence_solomon
      - compare_solomon_methods

  - title: "Historical Solomon analysis"
    desc: >
      Classical procedures retained for teaching and methodological replication.
    contents:
      - fit_solomon_classic
      - stouffer_solomon
      - p_to_z

  - title: "Structural equation models"
    desc: >
      Observed- and latent-variable SEM approaches to the Solomon design.
    contents:
      - fit_solomon_sem
      - fit_solomon_sem_latent

  - title: "Design validation and diagnostics"
    desc: >
      Check design coding, cell structure, and missingness before analysis.
    contents:
      - validate_solomon
      - check_solomon_missing
      - check_solomon_assumptions
      - power_solomon
      - plan_solomon

  - title: "Plotting"
    contents:
      - plot_solomon
      - plot_solomon_gg
      - plot_perm
      - plot_solomon_effects
      - plot_sensitization
      - plot_solomon_design
      - plot_solomon_change
      - plot_classic_flow
      - plot_power_solomon

  - title: "Data"
    contents:
      - solomon_example
      - solomon_demo

  - title: "Package"
    contents:
      - starts_with("solomonR")

articles:
  - title: "Start here"
    navbar: ~
    contents:
      - getting-started

  - title: "Analyses"
    navbar: Analyses
    contents:
      - glm-solomon
      - classic-solomon

  - title: "Methods and evidence"
    navbar: Methods and evidence
    contents:
      - solomon-methods
      - articles/validation-evidence
      - articles/ml-validation
      - articles/power-validation
      - articles/plan-validation

  - title: "References"
    navbar: References
    contents:
      - articles/references
